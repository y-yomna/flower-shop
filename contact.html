    <section class="contact-container position-relative bg-white d-flex flex-lg-row gap-3 my-5 shadow w-75 mx-auto flex-wrap-reverse flex-md-nowrap ">
      <div class="form-section position-relative w-100 w-lg-50 p-4">
        <h2 class="py-2">Contact Us</h2>
        <form>
          <div class="form-group py-3">
            <input type="email" class="form-control border-0 border-bottom" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter email">
          </div>
          <div class="form-group py-3">
            <input type="text" class="form-control border-0 border-bottom" id="InputName" placeholder="name">
          </div>
          <div class="form-group py-3">
            <textarea class="form-control border-0 border-bottom" id="Textarea" rows="1" placeholder="message"></textarea>
          </div>
          <button type="submit" class="btn text-white rounded-0 btn-lg my-3">Submit</button>
        </form>
      </div>
      
      <div class="info-section text-white w-100 w-lg-50  p-4 fs-5" style="background-color: rgb(0, 39, 38);">
