    <section class="contact-container container position-relative bg-white d-flex justify-content-center align-items-center my-5 shadow" style="height: 400px; width: 60%;">
      <div class="form-section position-absolute start-0 top-0 end-0 h-100 p-4 mx-2" style="width: 60%;">
            <h2 class="py-2">Contact Us</h2>
            <form>
              <div class="form-group">
                <label for="exampleInputEmail1">Email address</label>
                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter email">
              </div>
              <div class="form-group">
                <label for="InputName">name</label>
                <input type="text" class="form-control" id="InputName" placeholder="name">
              </div>
              <div class="form-group">
                <label for="Textarea">Example textarea</label>
                <textarea class="form-control" id="Textarea" rows="2"  placeholder="message"></textarea>
              </div>
              <button type="submit" class="btn text-white rounded-0 btn-lg m-4">Submit</button>
            </form>
        </div>
        <div class="links position-absolute h-100 end-0 d-flex justify-content-center align-items-end " style="background-color:#33c160; width: 20%;">
          <div class="d-flex gap-3 p-3 fs-5">
            <a href=""><i class="fa-brands fa-facebook-f"></i></a>
            <a href=""><i class="fa-brands fa-instagram"></i></a>

        </div>
        <div class="info-section text-white position-absolute top-30 bottom-30 end-0 p-4" style="background-color: rgb(0, 39, 38);">
            <h3 class="py-2">Info</h3>
            <p><i class="fa-regular fa-envelope pe-2"></i>Email: info@getintouch.we</p>
            <p><i class="fa-solid fa-phone pe-2"></i>Phone: +20123456789</p>
